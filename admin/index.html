<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好韻器 回報後台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
  /* 配色對齊主程式 light theme */
  --bg-grad-1: #0c4564;
  --bg-grad-2: #001e3b;
  --header-grad-1: #b8865d;
  --header-grad-2: #8d51c9;
  --container-bg: #eee3ce;
  --card-bg: #f7fafc;
  --text-primary: #2d3748;
  --text-secondary: #6b778a;
  --text-muted: #94a0b8;
  --border: #d8cdb6;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
  --section-label: #6b778a;
  --section-badge-bg: rgba(45,55,72,.08);
  --input-bg: rgba(255,255,255,.15);
  --input-border: rgba(255,255,255,.3);
  --action-preview-bg: rgba(45,55,72,.05);
  --action-preview-border: rgba(45,55,72,.1);
}

[data-theme="dark"] {
  --bg-grad-1: #1a202c;
  --bg-grad-2: #2d3748;
  --header-grad-1: #1a1f28;
  --header-grad-2: #174aa4;
  --container-bg: #2a313c;
  --card-bg: #1f2530;
  --text-primary: #e6e9ef;
  --text-secondary: #a0aec0;
  --text-muted: #6b778a;
  --border: #3a4453;
  --shadow: 0 1px 4px rgba(0,0,0,.5);
  --section-label: #a0aec0;
  --section-badge-bg: rgba(255,255,255,.08);
  --action-preview-bg: rgba(255,255,255,.04);
  --action-preview-border: rgba(255,255,255,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
  color: var(--text-primary); min-height: 100vh;
  transition: background .3s ease;
}

/* ── Top bar ── */
.topbar {
  background: linear-gradient(150deg, var(--header-grad-1) 5%, var(--header-grad-2) 100%);
  color: #fff; padding: 14px 24px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; }
.topbar-stats { font-size: 0.82rem; opacity: .85; flex: 1; }
.topbar input.key-input {
  background: var(--input-bg); color: #fff; border: 1px solid var(--input-border);
  border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; width: 160px;
}
.topbar input.key-input::placeholder { color: rgba(255,255,255,.6); }
.topbar label.toggle {
  font-size: 0.82rem; display: flex; align-items: center; gap: 6px; cursor: pointer;
}
.btn {
  padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; transition: opacity .15s, background .15s;
}
.btn:hover { opacity: .85; }
.btn-reload { background: rgba(255,255,255,.22); color: #fff; }
.btn-theme  { background: rgba(255,255,255,.18); color: #fff; padding: 6px 10px; }
.btn-export { background: #fff; color: var(--header-grad-2); }
.btn-export:disabled { opacity: .4; cursor: not-allowed; }

/* ── Layout ── */
.main {
  max-width: 960px; margin: 0 auto; padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px;
}

/* ── Section ── */
.section-title {
  font-size: 0.78rem; font-weight: 700; letter-spacing: .08em;
  color: var(--section-label); text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
  text-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.section-badge {
  background: var(--section-badge-bg); color: var(--text-secondary);
  border-radius: 20px; padding: 1px 8px; font-size: 0.72rem;
}

/* ── Report card ── */
.card {
  background: var(--container-bg); color: var(--text-primary);
  border-radius: 12px; padding: 16px 18px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--border);
  transition: opacity .2s;
  margin-bottom: 8px;
}
.card.agreed   { border-left-color: #48bb78; opacity: .85; }
.card.dismissed{ border-left-color: var(--border); opacity: .6; }
.card.archived { border-left-color: #94a3b8; opacity: .55; }
.card.manual   { border-left-color: #ed8936; }

.card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.card-type-badge {
  font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  background: rgba(102,126,234,.18); color: #667eea;
}
.card-type-badge.word  { background: rgba(217,119,6,.18); color: #d97706; }
.card-type-badge.reading { background: rgba(124,58,237,.18); color: #7c3aed; }
.card-type-badge.feedback { background: rgba(2,132,199,.18); color: #0284c7; }
.card-time { font-size: 0.72rem; color: var(--text-muted); margin-left: auto; }

.card-body { font-size: 0.95rem; line-height: 1.6; }
.card-char  { font-size: 1.4rem; font-weight: 700; color: #5a35b0; }
.card-reading { font-size: 1.1rem; color: #667eea; font-family: 'JetBrains Mono', monospace; margin-left: 4px; }
.card-word  { font-size: 1.1rem; font-weight: 700; color: #d97706; }
.card-reason{ display: inline-block; margin-top: 4px; padding: 2px 10px;
              border-radius: 20px; font-size: 0.78rem; font-weight: 600;
              background: var(--section-badge-bg); color: var(--text-secondary); }
.card-text  { font-size: 0.88rem; color: var(--text-secondary); margin-top: 6px; white-space: pre-wrap; }

/* ── Action row ── */
.card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.action-preview {
  font-size: 0.75rem; color: var(--text-secondary); background: var(--action-preview-bg);
  border: 1px solid var(--action-preview-border); border-radius: 6px; padding: 3px 10px; flex: 1;
}
.action-preview.agreed   { color: #2f855a; border-color: rgba(72,187,120,.4); background: rgba(72,187,120,.12); }
.action-preview.dismissed{ color: var(--text-muted); }
.action-preview.archived { color: #94a3b8; border-color: rgba(148,163,184,.3); background: rgba(148,163,184,.08); }

.btn-agree    { background: #48bb78; color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-dismiss  { background: var(--section-badge-bg); color: var(--text-secondary); padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; }
.btn-archive  { background: rgba(148,163,184,.2); color: var(--text-secondary); padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; }
.btn-undo     { background: rgba(237,137,54,.18); color: #ed8936; padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; }
.btn-agree:hover    { background: #38a169; }
.btn[disabled] { opacity: .5; cursor: wait; }

/* ── Missing reading modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--container-bg); color: var(--text-primary);
  border-radius: 16px; padding: 28px 32px;
  width: 420px; max-width: 95vw;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.modal h3 { font-size: 1rem; margin-bottom: 16px; }
.modal label { font-size: 0.82rem; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.modal input, .modal textarea, .modal select {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 0.9rem; margin-bottom: 14px;
  font-family: inherit; background: var(--card-bg); color: var(--text-primary);
}
.modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #667eea; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Empty state ── */
.empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.9rem; }
.empty.error { color: #fc8181; }
.empty .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; opacity: .8; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>🔍 好韻器 回報後台</h1>
  <span class="topbar-stats" id="statsLabel">尚未載入</span>
  <input type="password" class="key-input" id="keyInput" placeholder="USER_REPORT_KEY">
  <label class="toggle"><input type="checkbox" id="showArchived"> 顯示已封存 (<span id="archivedCount">0</span>)</label>
  <button class="btn btn-theme" onclick="toggleTheme()" title="切換亮/暗">🌓</button>
  <button class="btn btn-reload" onclick="reload()">🔄 重新載入</button>
  <button class="btn btn-export" id="exportBtn" disabled onclick="exportChanges()">💾 匯出 agreed</button>
</div>

<!-- Main -->
<div class="main" id="main">
  <div class="empty">輸入 USER_REPORT_KEY 後按「重新載入」</div>
</div>

<style>
/* edit panel & action buttons 補強 */
.edit-panel { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.edit-panel input { flex: 1; min-width: 180px; padding: 6px 10px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text-primary);
  font-family: inherit; font-size: 0.9rem; }
.edit-panel input:focus { outline: none; border-color: #667eea; }
.btn-hide   { background: rgba(102,126,234,.18); color: #5b6cd1; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-remove { background: rgba(229,62,62,.18); color: #c53030; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-fix    { background: rgba(237,137,54,.18); color: #c05621; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-add    { background: #48bb78; color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-note   { background: rgba(124,58,237,.18); color: #7c3aed; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.action-preview.note { color: #7c3aed; border-color: rgba(124,58,237,.3); background: rgba(124,58,237,.08); }
.modify-arrow { color: var(--text-muted); margin: 0 6px; }
</style>

<!-- 通用「人工新增」modal（缺字 / 缺少讀音）-->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3 id="addModalTitle">➕ 新增</h3>
    <label id="addModalSubjectLabel">主體</label>
    <input id="addSubject">
    <label id="addModalContentLabel">內容</label>
    <input id="addContent" placeholder="">
    <label>分級</label>
    <select id="addTier">
      <option value="common">常用</option>
      <option value="normal" selected>一般</option>
      <option value="rare">冷僻</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-dismiss" onclick="closeAddModal()">取消</button>
      <button class="btn" style="background:#667eea;color:#fff" onclick="confirmAdd()">確認新增</button>
    </div>
  </div>
</div>

<script>
// ── Config ──
const WORKER_URL = 'https://lucky-hawaii.is3000dollar.workers.dev';
const KEY_LS = 'haoYunQi_admin_key';
const THEME_LS = 'haoYunQi_admin_theme';

// ── Action 動詞 ↔ 中文 ──
const ACTION_LABEL = {
  hide_char_reading:  a => `🙈 隱藏「${a.char}」讀音 ${a.reading}`,
  remove_char_reading:a => `🗑 移除「${a.char}」讀音 ${a.reading}`,
  fix_char_reading:   a => `✏️ 修正「${a.char}」${a.old_reading} → ${a.new_reading}`,
  manual_add_reading: a => `➕ 新增「${a.char}」讀音 ${a.new_reading}（${tierLabel(a.to_tier)}）`,
  hide_word:          a => `🙈 隱藏「${a.word}」`,
  remove_word:        a => `🗑 移除「${a.word}」`,
  fix_word_reading:   a => `✏️ 修正「${a.word}」注音 → ${a.new_z}`,
  manual_add_word:    a => `➕ 新增詞「${a.word}」（${a.z || '無注音'} / ${tierLabel(a.tier)}）`,
  accept_ai_word:     a => `✅ 收錄 AI 建議詞「${a.word}」`,
  modify_ai_word:     a => `✏️ AI 建議詞「${a.original}」改為「${a.modified}」收錄`,
  note:               a => `📝 備註：${a.text}`,
};

// ── Theme ──
function applyTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem(THEME_LS, next);
}
applyTheme(localStorage.getItem(THEME_LS) || 'light');

// ── State ──
let reports = [];          // [{kvKey, type, status, action, ...}]
let busyKeys = new Set();  // kvKey 進行中
let _editing = null;       // {kvKey, op, label, placeholder, defaultValue}
let _addModalCtx = null;   // {kvKey, op}（add modal 的目標）

const TONE_MARK_TO_DIGIT = { 'ˊ': '2', 'ˇ': '3', 'ˋ': '4', '˙': '5' };
function readingToDictKey(reading) {
  if (!reading) return '';
  const last = reading[reading.length - 1];
  if (TONE_MARK_TO_DIGIT[last]) return reading.slice(0, -1) + TONE_MARK_TO_DIGIT[last];
  return reading + '1';
}

// ── Key 管理 ──
const keyInputEl = document.getElementById('keyInput');
const savedKey = localStorage.getItem(KEY_LS);
if (savedKey) keyInputEl.value = savedKey;

function getKey() {
  const k = keyInputEl.value.trim();
  if (k) localStorage.setItem(KEY_LS, k);
  return k;
}

// ── Worker fetch ──
async function fetchReports() {
  const key = getKey();
  if (!key) { showError('請先輸入 USER_REPORT_KEY'); return; }
  setStats('載入中…');
  try {
    const res = await fetch(`${WORKER_URL}/reports.json?key=${encodeURIComponent(key)}`);
    if (res.status === 403) { showError('密鑰錯誤（403）'); return; }
    if (!res.ok) { showError(`載入失敗：HTTP ${res.status}`); return; }
    reports = await res.json();
    reports.forEach((r, i) => {
      if (!r.kvKey) r.kvKey = `__no_key_${i}`;
      normalizeAISuggest(r);
    });
    render();
  } catch(e) {
    showError(`網路錯誤：${e.message}`);
  }
}

async function postDecision(kvKey, status, action) {
  const key = getKey();
  if (!key) { alert('密鑰遺失'); return false; }
  busyKeys.add(kvKey); render();
  try {
    const res = await fetch(`${WORKER_URL}/reports/decision?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kvKey, status, action })
    });
    if (!res.ok) {
      const t = await res.text();
      alert(`寫入失敗 (${res.status})：${t}`);
      busyKeys.delete(kvKey); render();
      return false;
    }
    // 樂觀更新本地 state
    const r = reports.find(x => x.kvKey === kvKey);
    if (r) {
      if (status === 'pending') {
        delete r.status; delete r.decided_at; delete r.action;
      } else {
        r.status = status;
        r.decided_at = new Date().toISOString();
        if (action) r.action = action; else delete r.action;
      }
    }
    busyKeys.delete(kvKey);
    render();
    return true;
  } catch(e) {
    alert(`網路錯誤：${e.message}`);
    busyKeys.delete(kvKey); render();
    return false;
  }
}

// ── UI helpers ──
function setStats(text) { document.getElementById('statsLabel').textContent = text; }
function showError(msg) {
  document.getElementById('main').innerHTML = `<div class="empty error">${esc(msg)}<div class="hint">填入正確的 USER_REPORT_KEY 後按「重新載入」</div></div>`;
  setStats('—');
}

function reload() { fetchReports(); }
document.getElementById('showArchived').addEventListener('change', render);
keyInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') reload(); });

// ── Rendering ──
function render() {
  const main = document.getElementById('main');
  const showArchived = document.getElementById('showArchived').checked;
  const archivedTotal = reports.filter(r => r.status === 'archived').length;
  document.getElementById('archivedCount').textContent = archivedTotal;

  const visible = reports.filter(r => showArchived || r.status !== 'archived');

  if (reports.length === 0) {
    main.innerHTML = '<div class="empty">沒有回報資料</div>';
    setStats('共 0 筆');
    document.getElementById('exportBtn').disabled = true;
    return;
  }

  const total   = reports.length;
  const agreed  = reports.filter(r => r.status === 'agreed').length;
  const pending = reports.filter(r => !r.status).length;
  setStats(`共 ${total} 筆 · 待審 ${pending} · 已確認 ${agreed} · 已封存 ${archivedTotal}`);
  document.getElementById('exportBtn').disabled = agreed === 0;

  const aiSugg    = visible.filter(r => r.type === 'ai-word-suggest');
  const readReps  = visible.filter(r => r.type === 'char-reading-report');
  const wordReps  = visible.filter(r => r.type === 'word-report');
  const feedbacks = visible.filter(r => r.type === 'feedback');

  let html = '';
  if (aiSugg.length)    html += section('🌟 AI 建議收錄', aiSugg, renderAISuggestCard);
  if (readReps.length)  html += section('🔤 讀音回報', readReps, renderReadingCard);
  if (wordReps.length)  html += section('🃏 字卡回報', wordReps, renderWordCard);
  if (feedbacks.length) html += section('📬 一般回饋', feedbacks, renderFeedbackCard);
  if (!html) html = '<div class="empty">沒有符合條件的回報（archived 已隱藏）</div>';

  main.innerHTML = html;
}

function section(title, items, cardFn) {
  const pending = items.filter(r => !r.status).length;
  return `<div>
      <div class="section-title">${title}<span class="section-badge">${items.length} 筆 · 待審 ${pending}</span></div>
      ${items.map(cardFn).join('')}
    </div>`;
}

function fmtTime(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
  catch { return ts; }
}

// ── Action preview 文字 ──
function previewFor(r) {
  const status = r.status || 'pending';
  if (status === 'agreed' && r.action) {
    const fn = ACTION_LABEL[r.action.type];
    return fn ? '✓ ' + fn(r.action) : '✓ ' + r.action.type;
  }
  if (status === 'dismissed') return '× 忽略';
  if (status === 'archived')  return '📦 已封存';
  return '';
}

// ── 通用 dispatch ──
// op: hide / remove / fix(需要 input) / dismiss / archive / undo / addModal(缺字、缺少讀音) / accept / modify / note
function exec(kvKey, op, payload) {
  const r = reports.find(x => x.kvKey === kvKey);
  if (!r) return;
  if (op === 'dismiss') return postDecision(kvKey, 'dismissed', null);
  if (op === 'archive') return postDecision(kvKey, 'archived', null);
  if (op === 'undo')    return postDecision(kvKey, 'pending', null);
  const a = buildAction(r, op, payload);
  if (!a) return;
  postDecision(kvKey, 'agreed', a);
}

function buildAction(r, op, payload) {
  const reading = r.reading || '';
  const dict_key = readingToDictKey(reading);
  switch (op) {
    case 'hideReading':   return { type: 'hide_char_reading',   char: r.char, dict_key, reading, reason: r.reportType };
    case 'removeReading': return { type: 'remove_char_reading', char: r.char, dict_key, reading, reason: r.reportType };
    case 'fixReading':    return { type: 'fix_char_reading', char: r.char,
                                   old_reading: reading, old_dict_key: dict_key,
                                   new_reading: payload, new_dict_key: readingToDictKey(payload),
                                   reason: r.reportType };
    case 'hideWord':      return { type: 'hide_word',   word: r.word, reason: r.reportType };
    case 'removeWord':    return { type: 'remove_word', word: r.word, reason: r.reportType };
    case 'fixWord':       return { type: 'fix_word_reading', word: r.word, new_z: payload, reason: r.reportType };
    case 'acceptAI':      return { type: 'accept_ai_word', word: r.word };
    case 'modifyAI':      return { type: 'modify_ai_word', original: r.word, modified: r.modified || payload };
    case 'note':          return { type: 'note', text: payload };
    default: return null;
  }
}

// ── Edit panel（inline 輸入） ──
function openEdit(kvKey, op, opts) { _editing = { kvKey, op, ...(opts||{}) }; render(); setTimeout(()=>document.getElementById('editInput')?.focus(), 30); }
function closeEdit() { _editing = null; render(); }
function confirmEdit() {
  const val = document.getElementById('editInput').value.trim();
  if (!val) { alert('請輸入內容'); return; }
  const { kvKey, op } = _editing;
  _editing = null;
  exec(kvKey, op, val);
}
function editPanelHTML() {
  return `<div class="edit-panel">
    <input id="editInput" placeholder="${esc(_editing.placeholder || '')}" value="${esc(_editing.defaultValue || '')}"
      onkeydown="if(event.key==='Enter')confirmEdit();if(event.key==='Escape')closeEdit();">
    <button class="btn btn-agree" onclick="confirmEdit()">✓ 確認</button>
    <button class="btn btn-dismiss" onclick="closeEdit()">取消</button>
  </div>`;
}

// ── Add modal（缺字 / 缺少讀音 同意新增）──
function openAddModal(kvKey, op) {
  _addModalCtx = { kvKey, op };
  const r = reports.find(x => x.kvKey === kvKey);
  if (!r) return;
  const titleEl = document.getElementById('addModalTitle');
  const subjectLabelEl = document.getElementById('addModalSubjectLabel');
  const subjectEl = document.getElementById('addSubject');
  const contentLabelEl = document.getElementById('addModalContentLabel');
  const contentEl = document.getElementById('addContent');
  if (op === 'addReading') {
    // r 是 feedback 類型，subject 通常為「「X」缺少讀音」
    const charMatch = (r.subject || '').match(/「(.)」/);
    const ch = charMatch ? charMatch[1] : '';
    titleEl.textContent = '➕ 新增讀音';
    subjectLabelEl.textContent = '字';
    subjectEl.value = ch; subjectEl.readOnly = true;
    contentLabelEl.textContent = '注音（含聲調，例：ㄏㄜˊ）';
    contentEl.value = ''; contentEl.placeholder = 'ㄏㄜˊ';
  } else { // addWord（缺字）
    titleEl.textContent = '➕ 新增詞';
    subjectLabelEl.textContent = '詞';
    subjectEl.value = r.word || ''; subjectEl.readOnly = false;
    contentLabelEl.textContent = '注音（每字空格分隔，例：ㄏㄠˇ ㄩㄣˋ）';
    contentEl.value = ''; contentEl.placeholder = 'ㄏㄠˇ ㄩㄣˋ';
  }
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => contentEl.focus(), 30);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
  _addModalCtx = null;
}
async function confirmAdd() {
  if (!_addModalCtx) return;
  const { kvKey, op } = _addModalCtx;
  const subj = document.getElementById('addSubject').value.trim();
  const content = document.getElementById('addContent').value.trim();
  const tier = document.getElementById('addTier').value;
  let action;
  if (op === 'addReading') {
    if (!subj || !content) { alert('字 與 注音 都要填'); return; }
    action = { type: 'manual_add_reading', char: subj,
               new_reading: content, new_dict_key: readingToDictKey(content), to_tier: tier };
  } else {
    if (!subj) { alert('詞不可空'); return; }
    action = { type: 'manual_add_word', word: subj, z: content, tier };
  }
  closeAddModal();
  await postDecision(kvKey, 'agreed', action);
}

// ── 各類 card ──
function btn(cls, label, onclick, dis) {
  return `<button class="btn ${cls}" ${dis?'disabled':''} onclick="${onclick}">${label}</button>`;
}
function commonTrailing(r) {
  const dis = busyKeys.has(r.kvKey);
  return btn('btn-archive', '📦 Archive', `exec('${r.kvKey}','archive')`, dis);
}
function postActions(r) {
  const dis = busyKeys.has(r.kvKey);
  return btn('btn-undo', '↩ 還原', `exec('${r.kvKey}','undo')`, dis) + commonTrailing(r);
}

function cardShell(r, headerHtml, bodyHtml, actionsHtml) {
  const status = r.status || 'pending';
  const editing = _editing && _editing.kvKey === r.kvKey;
  return `<div class="card ${status}">
    <div class="card-header">${headerHtml}<span class="card-time">${fmtTime(r.ts)}</span></div>
    ${bodyHtml || ''}
    <div class="card-actions">
      <span class="action-preview ${status}">${esc(previewFor(r) || actionPlaceholder(r))}</span>
      ${editing ? '' : actionsHtml}
    </div>
    ${editing ? editPanelHTML() : ''}
  </div>`;
}
function actionPlaceholder(r) {
  if (r.type === 'feedback') return '→ 已讀 / 備註';
  if (r.type === 'ai-word-suggest') return r.action_kind === 'modify' ? '→ 同意修改後收錄 / 忽略' : '→ 同意收錄 / 忽略';
  return '→ 選擇處理方式';
}

function renderReadingCard(r) {
  const status = r.status || 'pending';
  const dis = busyKeys.has(r.kvKey);
  const k = r.kvKey;
  let actions;
  if (status !== 'pending') {
    actions = postActions(r);
  } else if (r.reportType === '讀音錯誤') {
    actions = btn('btn-hide','🙈 隱藏',`exec('${k}','hideReading')`,dis)
            + btn('btn-remove','🗑 移除',`exec('${k}','removeReading')`,dis)
            + btn('btn-fix','✏️ 修正',`openEdit('${k}','fixReading',{placeholder:'新注音(含聲調) 例：ㄏㄜˊ',defaultValue:'${esc(r.reading||'')}'})`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else if (r.reportType === '極度冷僻') {
    actions = btn('btn-hide','🙈 隱藏',`exec('${k}','hideReading')`,dis)
            + btn('btn-remove','🗑 完全移除',`exec('${k}','removeReading')`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else {
    actions = btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis) + commonTrailing(r);
  }
  const noteText = r.body ? `<div class="card-text">${esc(r.body)}</div>` : '';
  const header = `<span class="card-type-badge reading">讀音回報</span>
      <span class="card-char">${esc(r.char || '')}</span>
      <span class="card-reading">${esc(r.reading || '')}</span>
      <span class="card-reason">${esc(r.reportType || '')}</span>`;
  return cardShell(r, header, noteText, actions);
}

function renderWordCard(r) {
  const status = r.status || 'pending';
  const dis = busyKeys.has(r.kvKey);
  const k = r.kvKey;
  const rt = r.reportType || '';
  let actions;
  if (status !== 'pending') {
    actions = postActions(r);
  } else if (rt === '押韻錯誤' || rt === '詞不存在') {
    actions = btn('btn-hide','🙈 隱藏',`exec('${k}','hideWord')`,dis)
            + btn('btn-remove','🗑 移除',`exec('${k}','removeWord')`,dis)
            + btn('btn-fix','✏️ 修正注音',`openEdit('${k}','fixWord',{placeholder:'每字注音空格分隔 例：ㄏㄠˇ ㄩㄣˋ'})`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else if (rt === '極度冷僻') {
    actions = btn('btn-hide','🙈 隱藏',`exec('${k}','hideWord')`,dis)
            + btn('btn-remove','🗑 完全移除',`exec('${k}','removeWord')`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else if (rt === '重複出現') {
    actions = btn('btn-dismiss','忽略（執行時問題）',`exec('${k}','dismiss')`,dis) + commonTrailing(r);
  } else if (rt === '缺字') {
    // modal 中可編輯詞 + 注音 + 分級，「同意」與「更改」視為同一動作
    actions = btn('btn-add','✓ 新增（可編輯）',`openAddModal('${k}','addWord')`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else {
    actions = btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis) + commonTrailing(r);
  }
  const header = `<span class="card-type-badge word">字卡回報</span>
      <span class="card-word">${esc(r.word || '')}</span>
      <span class="card-reason">${esc(r.reportType || '')}</span>`;
  return cardShell(r, header, '', actions);
}

function renderFeedbackCard(r) {
  const status = r.status || 'pending';
  const dis = busyKeys.has(r.kvKey);
  const k = r.kvKey;
  const isMissingReading = (r.subject || '').includes('缺少讀音');
  let actions;
  if (status !== 'pending') {
    actions = postActions(r);
  } else if (isMissingReading) {
    actions = btn('btn-add','✓ 同意（新增）',`openAddModal('${k}','addReading')`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else {
    actions = btn('btn-dismiss','✓ 已讀',`exec('${k}','dismiss')`,dis)
            + btn('btn-note','📝 備註',`openEdit('${k}','note',{placeholder:'寫一句備註（會存進 KV，匯出時帶出來）'})`,dis)
            + commonTrailing(r);
  }
  const body = r.body ? `<div class="card-text">${esc(r.body)}</div>` : '';
  const header = `<span class="card-type-badge feedback">一般回饋</span>
      <span style="font-weight:600;font-size:.9rem">${esc(r.subject || '（無主旨）')}</span>`;
  return cardShell(r, header, body, actions);
}

function renderAISuggestCard(r) {
  const status = r.status || 'pending';
  const dis = busyKeys.has(r.kvKey);
  const k = r.kvKey;
  const isModify = r.action_kind === 'modify' || (r.modified && r.modified !== r.word);
  let actions;
  if (status !== 'pending') {
    actions = postActions(r);
  } else if (isModify) {
    actions = btn('btn-add','✓ 同意修改後收錄',`exec('${k}','modifyAI')`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  } else {
    actions = btn('btn-add','✓ 同意收錄',`exec('${k}','acceptAI')`,dis)
            + btn('btn-dismiss','忽略',`exec('${k}','dismiss')`,dis)
            + commonTrailing(r);
  }
  const arrow = isModify ? `<span class="modify-arrow">→</span><span class="card-word">${esc(r.modified || '')}</span>` : '';
  const header = `<span class="card-type-badge feedback">AI 建議收錄</span>
      <span class="card-word">${esc(r.word || '')}</span>${arrow}
      <span class="card-reason">${isModify ? '修改後收錄' : '直接收錄'}</span>`;
  return cardShell(r, header, '', actions);
}

// 補相容：reports 中可能有 r.action_kind 或 r.action='accept'/'modify'（從前端送的 schema）
function normalizeAISuggest(r) {
  if (r.type !== 'ai-word-suggest') return;
  if (!r.action_kind && r.action && typeof r.action === 'string') {
    r.action_kind = r.action;  // 從前端 postFeedback 來的 raw 欄位
    delete r.action;           // 避免跟 decision.action 撞名
  }
}

// ── Export ──
function exportChanges() {
  const actions = reports
    .filter(r => r.status === 'agreed' && r.action)
    .map(r => ({ ...r.action, agreed_at: r.decided_at, source_kvKey: r.kvKey }));

  if (actions.length === 0) { alert('沒有已確認的變更'); return; }

  const out = {
    schema_version: '1.0',
    generated_at: new Date().toISOString(),
    actions
  };

  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `pending-changes-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Helpers ──
function tierLabel(t) {
  return { common: '常用', normal: '一般', rare: '冷僻' }[t] || t;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

// ── 開啟即載入（若已有 key）──
if (savedKey) fetchReports();
</script>
