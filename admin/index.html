<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好韻器 回報後台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
  /* 配色對齊主程式 light theme */
  --bg-grad-1: #0c4564;
  --bg-grad-2: #001e3b;
  --header-grad-1: #b8865d;
  --header-grad-2: #8d51c9;
  --container-bg: #eee3ce;
  --card-bg: #f7fafc;
  --text-primary: #2d3748;
  --text-secondary: #6b778a;
  --text-muted: #94a0b8;
  --border: #d8cdb6;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
  --section-label: #6b778a;
  --section-badge-bg: rgba(45,55,72,.08);
  --input-bg: rgba(255,255,255,.15);
  --input-border: rgba(255,255,255,.3);
  --action-preview-bg: rgba(45,55,72,.05);
  --action-preview-border: rgba(45,55,72,.1);
}

[data-theme="dark"] {
  --bg-grad-1: #1a202c;
  --bg-grad-2: #2d3748;
  --header-grad-1: #1a1f28;
  --header-grad-2: #174aa4;
  --container-bg: #2a313c;
  --card-bg: #1f2530;
  --text-primary: #e6e9ef;
  --text-secondary: #a0aec0;
  --text-muted: #6b778a;
  --border: #3a4453;
  --shadow: 0 1px 4px rgba(0,0,0,.5);
  --section-label: #a0aec0;
  --section-badge-bg: rgba(255,255,255,.08);
  --action-preview-bg: rgba(255,255,255,.04);
  --action-preview-border: rgba(255,255,255,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
  color: var(--text-primary); min-height: 100vh;
  transition: background .3s ease;
}

/* ── Top bar ── */
.topbar {
  background: linear-gradient(150deg, var(--header-grad-1) 5%, var(--header-grad-2) 100%);
  color: #fff; padding: 14px 24px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; }
.topbar-stats { font-size: 0.82rem; opacity: .85; flex: 1; }
.topbar input.key-input {
  background: var(--input-bg); color: #fff; border: 1px solid var(--input-border);
  border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; width: 160px;
}
.topbar input.key-input::placeholder { color: rgba(255,255,255,.6); }
.topbar label.toggle {
  font-size: 0.82rem; display: flex; align-items: center; gap: 6px; cursor: pointer;
}
.btn {
  padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; transition: opacity .15s, background .15s;
}
.btn:hover { opacity: .85; }
.btn-reload { background: rgba(255,255,255,.22); color: #fff; }
.btn-theme  { background: rgba(255,255,255,.18); color: #fff; padding: 6px 10px; }
.btn-export { background: #fff; color: var(--header-grad-2); }
.btn-export:disabled { opacity: .4; cursor: not-allowed; }

/* ── Layout ── */
.main {
  max-width: 960px; margin: 0 auto; padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px;
}

/* ── Section ── */
.section-title {
  font-size: 0.78rem; font-weight: 700; letter-spacing: .08em;
  color: var(--section-label); text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
  text-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.section-badge {
  background: var(--section-badge-bg); color: var(--text-secondary);
  border-radius: 20px; padding: 1px 8px; font-size: 0.72rem;
}

/* ── Report card ── */
.card {
  background: var(--container-bg); color: var(--text-primary);
  border-radius: 12px; padding: 16px 18px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--border);
  transition: opacity .2s;
  margin-bottom: 8px;
}
.card.agreed   { border-left-color: #48bb78; opacity: .85; }
.card.dismissed{ border-left-color: var(--border); opacity: .6; }
.card.archived { border-left-color: #94a3b8; opacity: .55; }
.card.manual   { border-left-color: #ed8936; }

.card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.card-type-badge {
  font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  background: rgba(102,126,234,.18); color: #667eea;
}
.card-type-badge.word  { background: rgba(217,119,6,.18); color: #d97706; }
.card-type-badge.reading { background: rgba(124,58,237,.18); color: #7c3aed; }
.card-type-badge.feedback { background: rgba(2,132,199,.18); color: #0284c7; }
.card-time { font-size: 0.72rem; color: var(--text-muted); margin-left: auto; }

.card-body { font-size: 0.95rem; line-height: 1.6; }
.card-char  { font-size: 1.4rem; font-weight: 700; color: #5a35b0; }
.card-reading { font-size: 1.1rem; color: #667eea; font-family: 'JetBrains Mono', monospace; margin-left: 4px; }
.card-word  { font-size: 1.1rem; font-weight: 700; color: #d97706; }
.card-reason{ display: inline-block; margin-top: 4px; padding: 2px 10px;
              border-radius: 20px; font-size: 0.78rem; font-weight: 600;
              background: var(--section-badge-bg); color: var(--text-secondary); }
.card-text  { font-size: 0.88rem; color: var(--text-secondary); margin-top: 6px; white-space: pre-wrap; }

/* ── Action row ── */
.card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.action-preview {
  font-size: 0.75rem; color: var(--text-secondary); background: var(--action-preview-bg);
  border: 1px solid var(--action-preview-border); border-radius: 6px; padding: 3px 10px; flex: 1;
}
.action-preview.agreed   { color: #2f855a; border-color: rgba(72,187,120,.4); background: rgba(72,187,120,.12); }
.action-preview.dismissed{ color: var(--text-muted); }
.action-preview.archived { color: #94a3b8; border-color: rgba(148,163,184,.3); background: rgba(148,163,184,.08); }

.btn-agree    { background: #48bb78; color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-dismiss  { background: var(--section-badge-bg); color: var(--text-secondary); padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; }
.btn-archive  { background: rgba(148,163,184,.2); color: var(--text-secondary); padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; }
.btn-undo     { background: rgba(237,137,54,.18); color: #ed8936; padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; }
.btn-agree:hover    { background: #38a169; }
.btn[disabled] { opacity: .5; cursor: wait; }

/* ── Missing reading modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--container-bg); color: var(--text-primary);
  border-radius: 16px; padding: 28px 32px;
  width: 420px; max-width: 95vw;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.modal h3 { font-size: 1rem; margin-bottom: 16px; }
.modal label { font-size: 0.82rem; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.modal input, .modal textarea, .modal select {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 0.9rem; margin-bottom: 14px;
  font-family: inherit; background: var(--card-bg); color: var(--text-primary);
}
.modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #667eea; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Empty state ── */
.empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.9rem; }
.empty.error { color: #fc8181; }
.empty .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; opacity: .8; }

/* ── 多選 ── */
.card[data-kvkey] { cursor: default; user-select: none; }
.card[data-kvkey] *::selection { background: transparent; }
.card.selected {
  outline: 2px solid #d4a017;
  outline-offset: 0;
  background: rgba(250,204,21,.13);
}
[data-theme="dark"] .card.selected { background: rgba(250,204,21,.18); }

.marquee-box {
  position: fixed; display: none; z-index: 900;
  border: 1.5px dashed rgba(255,255,255,.7);
  background: rgba(255,255,255,.06);
  pointer-events: none;
}

.batch-bar {
  position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
  background: var(--container-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 18px; display: none; flex-direction: column; align-items: stretch; gap: 10px;
  box-shadow: 0 4px 28px rgba(0,0,0,.35);
  z-index: 950; font-size: 0.92rem; min-width: 130px;
}
.batch-bar.show { display: flex; }
.batch-bar .count { font-weight: 700; color: #d4a017; text-align: center; margin-bottom: 2px; }
.batch-bar .btn { font-size: 0.86rem; padding: 8px 14px; text-align: center; }
.batch-bar .btn-clear { background: var(--section-badge-bg); color: var(--text-secondary); }
</style>
</head>

<!-- Main -->

</div>

<!-- 字庫（用來自動查 AI 詞的注音）-->
<script src="../data/rhyme-dict.js"></script>
<script>
// ── 字 → 讀音 反查（給 AI 詞自動填注音用）──
// rhyme-dict.js 暴露 var _rhymeDictData = {'<注音+聲調>': '常用｜一般｜冷僻', ...}
const CHAR_READINGS = (() => {
  const m = new Map();
  if (typeof _rhymeDictData !== 'object' || !_rhymeDictData) return m;
  for (const [key, val] of Object.entries(_rhymeDictData)) {
    for (const ch of String(val).replace(/[｜\-]/g, '')) {
      if (!m.has(ch)) m.set(ch, []);
      m.get(ch).push(key);  // 例：'ㄔㄣˊ'
    }
  }
  return m;
})();
// 輸入「晨曦微亮」→ 「ㄔㄣˊ ㄒㄧ ㄨㄟˊ ㄌㄧㄤˋ」；缺字以「?」佔位；破音字取第一個讀音
function lookupWordZhuyin(word) {
  if (!word) return '';
  return Array.from(word).map(ch => {
    const arr = CHAR_READINGS.get(ch);
    return arr && arr.length ? arr[0] : '?';
  }).join(' ');
}
</script>

for (const [zy, py] of Object.entries(_zy2py)) {
  if (!_py2zy[py]) _py2zy[py] = zy;  // 一對多時取第一個（足夠日常使用）
}
const TONE_DIGIT_MARK = { '1':'', '2':'ˊ', '3':'ˇ', '4':'ˋ', '5':'˙', '0':'˙' };

// 把單一音節「正規化」成「注音 + 聲調符號」（無聲調=一聲）
function normalizeSyllable(tok) {
  if (!tok) return '';
  // 1) 切出聲調：尾端可能是 ˊˇˋ˙ 或 1-5 數字
  let body = tok, tone = '';
  const tailMark = tok.slice(-1);
  if ('ˊˇˋ˙'.includes(tailMark)) { body = tok.slice(0, -1); tone = tailMark; }
  else if (/[0-5]$/.test(tok)) { body = tok.slice(0, -1); tone = TONE_DIGIT_MARK[tok.slice(-1)] || ''; }
  // 2) body 若全是注音字 → 直接用
  if (/^[ㄅ-ㄩ]+$/.test(body)) return body + tone;
  // 3) body 若是拼音 → 查表
  const py = body.toLowerCase().replace(/v/g, 'ü').replace(/u:/g, 'ü');
  if (_py2zy[py]) return _py2zy[py] + tone;
  // 4) 處理 ju/qu/xu/yu 系列（拼音 u 實為 ü 的情形已內建表）
  return tok;  // 認不出，原樣回，讓 validator 抓
}

// 把使用者輸入的整串讀音正規化（合併空白、把 - / · 等視為分隔符）
function normalizeReading(raw) {
  if (raw == null) return '';
  let s = String(raw).trim();
  s = s.replace(/[\-\/·、,，‧]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  return s.split(' ').map(normalizeSyllable).filter(Boolean).join(' ');
}

// 檢查是否為合法注音串（每音節：注音字 + 可選聲調符號），可指定音節數
function isValidZhuyin(s, expected) {
  if (!s) return false;
  const parts = s.split(' ');
  if (expected != null && parts.length !== expected) return false;
  return parts.every(p => /^[ㄅ-ㄩ]+[ˊˇˋ˙]?$/.test(p));
}

// 顯示用 helper：對任意可能含拼音/dash/數字的字串先做一輪正規化
function dispRead(s) { return normalizeReading(s) || (s || ''); }

const TONE_MARK_TO_DIGIT = { 'ˊ': '2', 'ˇ': '3', 'ˋ': '4', '˙': '5' };
function readingToDictKey(reading) {
  if (!reading) return '';
  const last = reading[reading.length - 1];
  if (TONE_MARK_TO_DIGIT[last]) return reading.slice(0, -1) + TONE_MARK_TO_DIGIT[last];
  return reading + '1';
}

// ── Worker fetch ──
async function fetchReports() {
  const key = getKey();
  if (!key) { showError('請先輸入 USER_REPORT_KEY'); return; }
  setStats('載入中…');
  try {
    const res = await fetch(`${WORKER_URL}/reports.json?key=${encodeURIComponent(key)}`);
    if (res.status === 403) { showError('密鑰錯誤（403）'); return; }
    if (!res.ok) { showError(`載入失敗：HTTP ${res.status}`); return; }
    reports = await res.json();
    reports.forEach((r, i) => {
      if (!r.kvKey) r.kvKey = `__no_key_${i}`;
      normalizeAISuggest(r);
      // 顯示前正規化使用者輸入的讀音欄位（自由輸入 → 統一注音空格分隔）
      if (r.reading)   r.reading   = dispRead(r.reading);
      if (r.suggested) r.suggested = dispRead(r.suggested);
    });
    selectedKeys.clear(); _lastClickedKey = null;
    render();
  } catch(e) {
    showError(`網路錯誤：${e.message}`);
  }
}

async function postDecision(kvKey, status, action) {
  const key = getKey();
  if (!key) { alert('密鑰遺失'); return false; }
  busyKeys.add(kvKey); render();
  try {
    const res = await fetch(`${WORKER_URL}/reports/decision?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kvKey, status, action })
    });
    if (!res.ok) {
      const t = await res.text();
      alert(`寫入失敗 (${res.status})：${t}`);
      busyKeys.delete(kvKey); render();
      return false;
    }
    // 樂觀更新本地 state
    const r = reports.find(x => x.kvKey === kvKey);
    if (r) {
      if (status === 'pending') {
        delete r.status; delete r.decided_at; delete r.action;
      } else {
        r.status = status;
        r.decided_at = new Date().toISOString();
        if (action) r.action = action; else delete r.action;
      }
    }
    busyKeys.delete(kvKey);
    render();
    return true;
  } catch(e) {
    alert(`網路錯誤：${e.message}`);
    busyKeys.delete(kvKey); render();
    return false;
  }
}

// ── Rendering ──
function render() {
  const main = document.getElementById('main');
  const showArchived = document.getElementById('showArchived').checked;
  const archivedTotal = reports.filter(r => r.status === 'archived').length;
  document.getElementById('archivedCount').textContent = archivedTotal;

  const visible = reports.filter(r => showArchived || r.status !== 'archived');

  if (reports.length === 0) {
    main.innerHTML = '<div class="empty">沒有回報資料</div>';
    setStats('共 0 筆');
    document.getElementById('exportBtn').disabled = true;
    return;
  }

  const total   = reports.length;
  const agreed  = reports.filter(r => r.status === 'agreed').length;
  const pending = reports.filter(r => !r.status).length;
  setStats(`共 ${total} 筆 · 待審 ${pending} · 已確認 ${agreed} · 已封存 ${archivedTotal}`);
  document.getElementById('exportBtn').disabled = agreed === 0;

  const aiSugg    = visible.filter(r => r.type === 'ai-word-suggest');
  const readReps  = visible.filter(r => r.type === 'char-reading-report');
  const wordReps  = visible.filter(r => r.type === 'word-report');
  const feedbacks = visible.filter(r => r.type === 'feedback');

  let html = '';
  if (aiSugg.length)    html += section('🌟 AI 建議收錄', aiSugg, renderAISuggestCard);
  if (readReps.length)  html += section('🔤 讀音回報', readReps, renderReadingCard);
  if (wordReps.length)  html += section('🃏 字卡回報', wordReps, renderWordCard);
  if (feedbacks.length) html += section('📬 一般回饋', feedbacks, renderFeedbackCard);
  if (!html) html = '<div class="empty">沒有符合條件的回報（archived 已隱藏）</div>';

  main.innerHTML = html;
  updateBatchBar();
}

function section(title, items, cardFn) {
  const pending = items.filter(r => !r.status).length;
  return `<div>
      <div class="section-title">${title}<span class="section-badge">${items.length} 筆 · 待審 ${pending}</span></div>
      ${items.map(cardFn).join('')}
    </div>`;
}

function fmtTime(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
  catch { return ts; }
}

// ── Action preview 文字 ──
function previewFor(r) {
  const status = r.status || 'pending';
  if (status === 'agreed' && r.action) {
    const fn = ACTION_LABEL[r.action.type];
    return fn ? '✓ ' + fn(r.action) : '✓ ' + r.action.type;
  }
  if (status === 'dismissed') return '× 忽略';
  if (status === 'archived')  return '📦 已封存';
  return '';
}

// ── 通用 dispatch ──
// op: hide / remove / fix(需要 input) / dismiss / archive / undo / addModal(缺字、缺少讀音) / accept / modify / note
function exec(kvKey, op, payload) {
  const r = reports.find(x => x.kvKey === kvKey);
  if (!r) return;
  if (op === 'dismiss') return postDecision(kvKey, 'dismissed', null);
  if (op === 'archive') return postDecision(kvKey, 'archived', null);
  if (op === 'undo')    return postDecision(kvKey, 'pending', null);
  if (op === 'delete')  return deleteReport(kvKey);
  const a = buildAction(r, op, payload);
  if (!a) return;
  postDecision(kvKey, 'agreed', a);
}

function buildAction(r, op, payload) {
  const reading = r.reading || '';
  const dict_key = readingToDictKey(reading);
  switch (op) {
    case 'hideReading':   return { type: 'hide_char_reading',   char: r.char, dict_key, reading, reason: r.reportType };
    case 'removeReading': return { type: 'remove_char_reading', char: r.char, dict_key, reading, reason: r.reportType };
    case 'fixReading':    return { type: 'fix_char_reading', char: r.char,
                                   old_reading: reading, old_dict_key: dict_key,
                                   new_reading: payload, new_dict_key: readingToDictKey(payload),
                                   reason: r.reportType };
    case 'hideWord':      return { type: 'hide_word',   word: r.word, reason: r.reportType };
    case 'removeWord':    return { type: 'remove_word', word: r.word, reason: r.reportType };
    case 'fixWord':       return { type: 'fix_word_reading', word: r.word, new_z: payload, reason: r.reportType };
    case 'acceptAI':      return { type: 'accept_ai_word', word: r.word, z: payload };
    case 'modifyAI':      return { type: 'modify_ai_word', original: r.word, modified: r.modified || r.word, z: payload };
    case 'note':          return { type: 'note', text: payload };
    default: return null;
  }
}

// ── 永久刪除 ──
async function deleteReport(kvKey) {
  if (!confirm('永久刪除這筆回報？此操作無法還原。')) return;
  const key = getKey();
  if (!key) { alert('密鑰遺失'); return; }
  busyKeys.add(kvKey); render();
  try {
    const res = await fetch(`${WORKER_URL}/reports/delete?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kvKey })
    });
    if (!res.ok) {
      const t = await res.text();
      alert(`刪除失敗 (${res.status})：${t}`);
      busyKeys.delete(kvKey); render();
      return;
    }
    reports = reports.filter(x => x.kvKey !== kvKey);
    busyKeys.delete(kvKey);
    render();
  } catch(e) {
    alert(`網路錯誤：${e.message}`);
    busyKeys.delete(kvKey); render();
  }
}

// ── Edit panel（inline 輸入） ──
function openEdit(kvKey, op, opts) { _editing = { kvKey, op, ...(opts||{}) }; render(); setTimeout(()=>document.getElementById('editInput')?.focus(), 30); }
function closeEdit() { _editing = null; render(); }
function confirmEdit() {
  const inp = document.getElementById('editInput');
  const raw = inp.value.trim();
  if (!raw) { alert('請輸入內容'); return; }
  const { kvKey, op } = _editing;
  // 讀音類動作要校驗
  const NEEDS_ZHUYIN = { fixReading: 1, fixWord: 'word' };
  if (op in NEEDS_ZHUYIN) {
    const norm = normalizeReading(raw);
    let expected = NEEDS_ZHUYIN[op];
    if (expected === 'word') {
      const r = reports.find(x => x.kvKey === kvKey);
      expected = r && r.word ? Array.from(r.word).length : null;
    }
    if (!isValidZhuyin(norm, expected)) {
      alert(`格式錯誤：請用注音 + 空格分隔${expected? ('（需 ' + expected + ' 個音節）') : ''}\n例：ㄏㄠˇ ㄩㄣˋ\n你輸入的：${raw}\n推測為：${norm || '(無法解析)'}`);
      inp.value = norm || raw;
      inp.focus(); inp.select();
      return;
    }
    inp.value = norm;
    _editing = null;
    exec(kvKey, op, norm);
    return;
  }
  _editing = null;
  exec(kvKey, op, raw);
}
function editPanelHTML() {
  return `<div class="edit-panel">
    <input id="editInput" placeholder="${esc(_editing.placeholder || '')}" value="${esc(_editing.defaultValue || '')}"
      onkeydown="if(event.key==='Enter')confirmEdit();if(event.key==='Escape')closeEdit();">
    <button class="btn btn-agree" onclick="confirmEdit()">✓ 確認</button>
    <button class="btn btn-dismiss" onclick="closeEdit()">取消</button>
  </div>`;
}

function openAddModal(kvKey, op) {
  _addModalCtx = { kvKey, op };
  const r = reports.find(x => x.kvKey === kvKey);
  if (!r) return;
  const titleEl = document.getElementById('addModalTitle');
  const subjectLabelEl = document.getElementById('addModalSubjectLabel');
  const subjectEl = document.getElementById('addSubject');
  const contentLabelEl = document.getElementById('addModalContentLabel');
  const contentEl = document.getElementById('addContent');
  if (op === 'addReading') {
    // r 是 feedback 類型，subject 通常為「「X」缺少讀音」
    const charMatch = (r.subject || '').match(/「(.)」/);
    const ch = charMatch ? charMatch[1] : '';
    titleEl.textContent = '➕ 新增讀音';
    subjectLabelEl.textContent = '字';
    subjectEl.value = ch; subjectEl.readOnly = true;
    contentLabelEl.textContent = '注音（含聲調，例：ㄏㄜˊ）';
    contentEl.value = ''; contentEl.placeholder = 'ㄏㄜˊ';
  } else { // addWord（缺字）

// 從字卡內嵌的輸入框取注音，再走 exec
function execAI(kvKey, mode) {
  const inp = document.getElementById(`aiZ-${kvKey}`);
  const raw = (inp?.value || '').trim();
  if (!raw) { alert('請填注音'); inp?.focus(); return; }
  // 含「?」的缺字 placeholder 允許保留，但其它部分仍要正規化成注音
  const hasQ = raw.includes('?');
  const r = reports.find(x => x.kvKey === kvKey);
  const targetWord = r ? (mode === 'accept' ? r.word : (r.modified || r.word)) : '';
  const expected = targetWord ? Array.from(targetWord).length : null;
  let z;
  if (hasQ) {
    // 逐音節：「?」保留，其它正規化
    z = raw.split(/\s+/).map(t => t === '?' ? '?' : normalizeSyllable(t)).join(' ');
    // 校驗每音節必須是 ? 或合法注音
    const parts = z.split(' ');
    const okLen = expected == null || parts.length === expected;
    const okEach = parts.every(p => p === '?' || /^[ㄅ-ㄩ]+[ˊˇˋ˙]?$/.test(p));
    if (!okLen || !okEach) {
      alert(`格式錯誤：請用注音 + 空格分隔（缺字位置可留「?」）\n例：ㄏㄠˇ ?\n你輸入：${raw}\n推測為：${z}`);
      inp.value = z; inp.focus(); inp.select();
      return;
    }
    if (!confirm('注音含「?」（缺字），仍要送出嗎？')) { inp.focus(); return; }
  } else {
    z = normalizeReading(raw);
    if (!isValidZhuyin(z, expected)) {
      alert(`格式錯誤：請用注音 + 空格分隔${expected ? '（需 ' + expected + ' 個音節）' : ''}\n例：ㄏㄠˇ ㄩㄣˋ\n你輸入：${raw}\n推測為：${z || '(無法解析)'}`);
      inp.value = z || raw; inp.focus(); inp.select();
      return;
    }
  }
  inp.value = z;
  exec(kvKey, mode === 'accept' ? 'acceptAI' : 'modifyAI', z);
}

// 補相容：reports 中可能有 r.action_kind 或 r.action='accept'/'modify'（從前端送的 schema）
function normalizeAISuggest(r) {
  if (r.type !== 'ai-word-suggest') return;
  if (!r.action_kind && r.action && typeof r.action === 'string') {
    r.action_kind = r.action;  // 從前端 postFeedback 來的 raw 欄位
    delete r.action;           // 避免跟 decision.action 撞名
  }
}

// 產生一份 standalone .py 腳本，內嵌本批 actions + 套用邏輯。
// 跑起來會把變更累積寫進 data/rhyme-dict-overrides.json 與 data/wordlist-overrides.json，
// 兩個 json 都是「同一檔不斷追加」。原始 rhyme-dict.js / wordlist-c*.json 完全不動。
function exportChanges() {
  const actions = reports
    .filter(r => r.status === 'agreed' && r.action)
    .map(r => ({ ...r.action, agreed_at: r.decided_at, source_kvKey: r.kvKey }));

  if (actions.length === 0) { alert('沒有已確認的變更'); return; }

  // 匯出前 sanity check：所有讀音欄位都要符合「注音 + 空格分隔」格式
  const bad = [];
  for (const a of actions) {
    const checks = [];
    if (a.type === 'fix_word_reading')   checks.push(['new_z', a.new_z, Array.from(a.word || '').length]);
    if (a.type === 'manual_add_word' && a.z) checks.push(['z', a.z, Array.from(a.word || '').length]);
    if (a.type === 'accept_ai_word' && a.z)  checks.push(['z', a.z, Array.from(a.word || '').length]);
    if (a.type === 'modify_ai_word' && a.z)  checks.push(['z', a.z, Array.from(a.modified || '').length]);
    if (a.type === 'fix_char_reading')   checks.push(['new_reading', a.new_reading, 1]);
    if (a.type === 'manual_add_reading') checks.push(['new_reading', a.new_reading, 1]);
    for (const [field, val, expect] of checks) {
      if (!isValidZhuyin(val, expect)) {
        bad.push(`• ${a.type} 「${a.word || a.char || a.modified || ''}」.${field} = ${JSON.stringify(val)}（需 ${expect} 個注音音節）`);
      }
    }
  }
  if (bad.length) {
    alert('以下 agreed action 的注音格式不合法，請先回到該卡片修正後再匯出：\n\n' + bad.join('\n'));
    return;
  }

  const today = new Date().toISOString().slice(0, 10);
  const generatedAt = new Date().toISOString();
  const typeCounts = {};
  for (const a of actions) typeCounts[a.type] = (typeCounts[a.type] || 0) + 1;
  const typeSummary = Object.entries(typeCounts).map(([t, n]) => `#   ${t}: ${n}`).join('\n');
  const kvKeys = actions.map(a => `#   ${a.source_kvKey}  (${a.type})`).join('\n');

  // actions 用 JSON 內嵌（Python 認得 JSON literal 但 true/false/null 與 JS 不同 → 用 json.loads）
  const actionsJSON = JSON.stringify(actions, null, 2);

  const py = `#!/usr/bin/env python3

由 admin 後台「匯出 agreed」於 ${generatedAt} 產生。

${typeSummary}

${kvKeys}

    python3 apply_changes_${today}.py            # 套用
    python3 apply_changes_${today}.py --dry-run  # 預覽

日誌：
  data/applied-changes.log

# ── 注音格式雙重把關（admin 已校驗過，這裡是保險絲）──
import re
_ZY_SYL = re.compile(r'^[ㄅ-ㄩ]+[ˊˇˋ˙]?$')
def _valid_z(s, n=None):
    if not isinstance(s, str) or not s: return False
    parts = s.split(' ')
    if n is not None and len(parts) != n: return False
    return all(_ZY_SYL.match(p) for p in parts)
def _word_len(w): return len(w) if isinstance(w, str) else 0

_bad = []

# ── overrides schema v2（分區清楚版）──
# wordlist-overrides.json:
#   {
#     "version": 2,
#     "removed":  [word, ...],                        # 一字一筆，10 個換行
#     "hidden":   [word, ...],
#     "fixed":    {word: z, ...},                     # 逐詞換行
#     "added":    [{w, z, tier, source, agreed_at?, source_kvKey?, original?}, ...],
#     "updated_at": "..."
#   }
# rhyme-dict-overrides.json:
#   {
#     "version": 2,
#     "removed":  [{char, dict_key, reading?}, ...],
#     "hidden":   [{char, dict_key, reading?}, ...],
#     "fixed":    [{char, from, to, tier?}, ...],     # from/to = dict_key
#     "added":    [{char, reading, dict_key, tier, agreed_at?, source_kvKey?}, ...],
#     "updated_at": "..."
#   }
# 審計記錄不入 JSON，全部寫進 data/applied-changes.log

def load_json(path, default):
    if path.exists():
        try: return json.loads(path.read_text(encoding='utf-8'))
        except Exception as e:
            print(f'  [WARN] 讀取 {path.name} 失敗，視為空：{e}')
    return default

def ensure_rhyme_ovr():
    d = load_json(RHYME_OVR, None)
    if not d or d.get('version') != 2:
        return {'version': 2, 'removed': [], 'hidden': [], 'fixed': [], 'added': []}
    for k in ('removed','hidden','fixed','added'):
        d.setdefault(k, [])
    return d

def ensure_word_ovr():
    d = load_json(WORD_OVR, None)
    if not d or d.get('version') != 2:
        return {'version': 2, 'removed': [], 'hidden': [], 'fixed': {}, 'added': []}
    d.setdefault('removed', []); d.setdefault('hidden', [])
    d.setdefault('fixed', {});   d.setdefault('added', [])
    return d

# ── 自訂排版寫入 ──
def _q(s):
    return json.dumps(s, ensure_ascii=False)

def _fmt_str_array(arr, per_line=10, indent='    '):
    if not arr: return '[]'
    items = [_q(x) for x in arr]
    if len(items) <= per_line:
        return '[' + ', '.join(items) + ']'
    chunks = [', '.join(items[i:i+per_line]) for i in range(0, len(items), per_line)]
    return '[\\n' + indent + (',\\n' + indent).join(chunks) + '\\n  ]'

def _fmt_obj_array(arr, indent='    '):
    if not arr: return '[]'
    lines = [json.dumps(x, ensure_ascii=False) for x in arr]
    return '[\\n' + indent + (',\\n' + indent).join(lines) + '\\n  ]'

def _fmt_str_dict(d, indent='    '):
    if not d: return '{}'
    lines = [f'{_q(k)}: {_q(v)}' for k, v in d.items()]
    return '{\\n' + indent + (',\\n' + indent).join(lines) + '\\n  }'

def save_word_ovr(data):
    if DRY_RUN:
        print(f'  [DRY RUN] would write {WORD_OVR.name}'); return
    out = (
        '{\\n'
        f'  "version": {data["version"]},\\n\\n'
        f'  "removed": {_fmt_str_array(data["removed"])},\\n\\n'
        f'  "hidden": {_fmt_str_array(data["hidden"])},\\n\\n'
        f'  "fixed": {_fmt_str_dict(data["fixed"])},\\n\\n'
        f'  "added": {_fmt_obj_array(data["added"])},\\n\\n'
        f'  "updated_at": {_q(data["updated_at"])}\\n'
        '}\\n'
    )
    WORD_OVR.write_text(out, encoding='utf-8')

# ── 去重 helpers ──
def _add_str_unique(lst, s):
    if s not in lst: lst.append(s)

def _add_obj_unique(lst, item, keys):
    sig = tuple(item.get(k) for k in keys)
    for ex in lst:
        if tuple(ex.get(k) for k in keys) == sig: return
    lst.append(item)

def _remove_str(lst, s):
    if s in lst: lst.remove(s)

# ── 套用單一 action ──
def apply_action(action, rhyme_ovr, word_ovr):
    t = action.get('type')
    meta = {k: action.get(k) for k in ('agreed_at', 'source_kvKey') if action.get(k)}

    # ── 字級 ──
    if t in ('hide_char_reading', 'remove_char_reading'):
        bucket = 'hidden' if t == 'hide_char_reading' else 'removed'
        entry = {'char': action['char'], 'dict_key': action['dict_key']}
        if action.get('reading'): entry['reading'] = action['reading']
        _add_obj_unique(rhyme_ovr[bucket], entry, ('char', 'dict_key'))
        print(f'  ✓ {t}  {action["char"]}|{action["dict_key"]}')
        return 'rhyme'

    if t == 'fix_char_reading':
        entry = {
            'char': action['char'],
            'from': action['old_dict_key'],
            'to':   action['new_dict_key'],
        }
        # 同字同 from 視為更新（用新 to 覆蓋）
        for ex in rhyme_ovr['fixed']:
            if ex.get('char') == entry['char'] and ex.get('from') == entry['from']:
                ex.update(entry); break
        else:
            rhyme_ovr['fixed'].append(entry)
        print(f'  ✓ fix_char_reading  {action["char"]}|{action["old_dict_key"]} → {action["new_dict_key"]}')
        return 'rhyme'

    if t == 'manual_add_reading':
        entry = {
            'char':     action['char'],
            'reading':  action['new_reading'],
            'dict_key': action['new_dict_key'],
            'tier':     action.get('to_tier', 'normal'),
            **meta,
        }
        _add_obj_unique(rhyme_ovr['added'], entry, ('char', 'dict_key'))
        print(f'  ✓ manual_add_reading  {action["char"]} {action["new_reading"]} ({action.get("to_tier")})')
        return 'rhyme'

    # ── 詞級 ──
    if t == 'remove_word':
        _add_str_unique(word_ovr['removed'], action['word'])
        _remove_str(word_ovr['hidden'], action['word'])  # 互斥
        word_ovr['fixed'].pop(action['word'], None)
        print(f'  ✓ remove_word  {action["word"]}')
        return 'word'

    if t == 'hide_word':
        _add_str_unique(word_ovr['hidden'], action['word'])
        _remove_str(word_ovr['removed'], action['word'])
        print(f'  ✓ hide_word  {action["word"]}')
        return 'word'

    if t == 'fix_word_reading':
        word_ovr['fixed'][action['word']] = action['new_z']
        print(f'  ✓ fix_word_reading  {action["word"]} → {action["new_z"]}')
        return 'word'

    if t == 'manual_add_word':
        entry = {
            'w': action['word'], 'z': action.get('z', ''),
            'tier': action.get('tier', 'normal'),
            'source': 'manual', **meta,
        }
        _add_obj_unique(word_ovr['added'], entry, ('w',))
        if not action.get('z'):
            print(f'  [WARN] manual_add_word "{action["word"]}" 缺注音 z')
        print(f'  ✓ manual_add_word  {action["word"]} ({action.get("z","?")})')
        return 'word'

    if t == 'accept_ai_word':
        z = action.get('z', '')
        entry = {'w': action['word'], 'z': z, 'tier': 'normal', 'source': 'ai_accept', **meta}
        _add_obj_unique(word_ovr['added'], entry, ('w',))
        if not z or '?' in z:
            print(f'  [WARN] accept_ai_word "{action["word"]}" 注音空或含 ?：{z!r}')
        else:
            print(f'  ✓ accept_ai_word  {action["word"]} ({z})')
        return 'word'

    if t == 'modify_ai_word':
        z = action.get('z', '')
        entry = {
            'w': action['modified'], 'z': z, 'tier': 'normal',
            'source': 'ai_modify', 'original': action.get('original'), **meta,
        }
        _add_obj_unique(word_ovr['added'], entry, ('w',))
        if not z or '?' in z:
            print(f'  [WARN] modify_ai_word "{action.get("original")}" → "{action["modified"]}" 注音空或含 ?：{z!r}')
        else:
            print(f'  ✓ modify_ai_word  {action.get("original")} → {action["modified"]} ({z})')
        return 'word'

    if t == 'note':
        print(f'  📝 note: {action.get("text", "")}')
        return None

    print(f'  [SKIP] 未知 action type: {t}')
    return None

# ── 主流程 ──
def main():
    tag = '[DRY RUN] ' if DRY_RUN else ''
    print(f'{tag}apply_changes_${today}  |  {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}')

if __name__ == '__main__':

// ── Helpers ──
function tierLabel(t) {
  return { common: '常用', normal: '一般', rare: '冷僻' }[t] || t;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

// ── 多選互動 ──
function updateBatchBar() {
  // 先把已不存在的 key 從選取清單剔掉
  const live = new Set(reports.map(r => r.kvKey));
  for (const k of Array.from(selectedKeys)) if (!live.has(k)) selectedKeys.delete(k);
  document.querySelectorAll('.card[data-kvkey]').forEach(c => {
    c.classList.toggle('selected', selectedKeys.has(c.dataset.kvkey));
  });
  const bar = document.getElementById('batchBar');
  bar.classList.toggle('show', selectedKeys.size > 0);
  document.getElementById('batchCount').textContent = selectedKeys.size;
}
function clearSelection() {
  selectedKeys.clear(); _lastClickedKey = null; updateBatchBar();
}
function selectRange(fromKey, toKey) {
  const keys = Array.from(document.querySelectorAll('.card[data-kvkey]')).map(c => c.dataset.kvkey);
  const i = keys.indexOf(fromKey), j = keys.indexOf(toKey);
  if (i < 0 || j < 0) { selectedKeys.add(toKey); return; }
  const [a, b] = i < j ? [i, j] : [j, i];
  for (let k = a; k <= b; k++) selectedKeys.add(keys[k]);
}

document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  // 點到互動元素 → 完全不介入（按鈕、輸入框、modal 內部）
  if (e.target.closest('button, input, textarea, select, a, label, .modal, .modal-overlay, .batch-bar, .topbar')) return;
  // modal 開啟時整個畫面凍結，不啟動框選
  if (document.querySelector('.modal-overlay.show')) return;
  const card = e.target.closest('.card[data-kvkey]');
  if (card) {
    const k = card.dataset.kvkey;
    if (e.shiftKey && _lastClickedKey) {
      if (!(e.metaKey || e.ctrlKey)) selectedKeys.clear();
      selectRange(_lastClickedKey, k);
    } else if (e.metaKey || e.ctrlKey) {
      if (selectedKeys.has(k)) selectedKeys.delete(k); else selectedKeys.add(k);
    } else {
      const alreadyOnly = selectedKeys.has(k) && selectedKeys.size === 1;
      selectedKeys.clear();
      if (!alreadyOnly) selectedKeys.add(k);
    }
    _lastClickedKey = k;
    e.preventDefault();
    updateBatchBar();
    return;
  }
  // 點到空白 → 開始橡皮筋
  e.preventDefault();
  _marquee = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY, moved: false,
               additive: e.metaKey || e.ctrlKey || e.shiftKey };
  document.addEventListener('mousemove', onMarqueeMove);
  document.addEventListener('mouseup', onMarqueeUp);
});

function onMarqueeMove(e) {
  if (!_marquee) return;
  _marquee.x1 = e.clientX; _marquee.y1 = e.clientY;
  if (!_marquee.moved &&
      Math.abs(_marquee.x1 - _marquee.x0) + Math.abs(_marquee.y1 - _marquee.y0) > 4) {
    _marquee.moved = true;
    document.getElementById('marqueeBox').style.display = 'block';
  }
  if (_marquee.moved) {
    e.preventDefault();
    const box = document.getElementById('marqueeBox');
    const x = Math.min(_marquee.x0, _marquee.x1);
    const y = Math.min(_marquee.y0, _marquee.y1);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width  = Math.abs(_marquee.x1 - _marquee.x0) + 'px';
    box.style.height = Math.abs(_marquee.y1 - _marquee.y0) + 'px';
    // 即時預覽：相交即選
    if (!_marquee.additive) selectedKeys.clear();
    document.querySelectorAll('.card[data-kvkey]').forEach(c => {
      const r = c.getBoundingClientRect();
      const hit = !(r.right < x || r.left > x + parseFloat(box.style.width) ||
                    r.bottom < y || r.top > y + parseFloat(box.style.height));
      if (hit) selectedKeys.add(c.dataset.kvkey);
    });
    updateBatchBar();
  }
}
function onMarqueeUp() {
  document.removeEventListener('mousemove', onMarqueeMove);
  document.removeEventListener('mouseup', onMarqueeUp);
  document.getElementById('marqueeBox').style.display = 'none';
  if (_marquee && !_marquee.moved && !_marquee.additive) {
    // 純空白點擊 → 清除
    selectedKeys.clear(); _lastClickedKey = null; updateBatchBar();
  }
  _marquee = null;
}

// 批次動作
async function batchArchive() {
  const keys = Array.from(selectedKeys);
  const targets = keys.map(k => reports.find(r => r.kvKey === k)).filter(r => r && r.status !== 'archived');
  if (!targets.length) { alert('沒有可封存的項目'); return; }
  if (!confirm(`封存 ${targets.length} 筆？`)) return;
  for (const r of targets) await postDecision(r.kvKey, 'archived', null);
  selectedKeys.clear(); _lastClickedKey = null; updateBatchBar();
}
async function batchRestore() {
  const keys = Array.from(selectedKeys);
  const targets = keys.map(k => reports.find(r => r.kvKey === k)).filter(r => r && r.status);
  if (!targets.length) { alert('沒有可還原的項目（已是待審狀態）'); return; }
  if (!confirm(`還原 ${targets.length} 筆為待審？`)) return;
  for (const r of targets) await postDecision(r.kvKey, 'pending', null);
  selectedKeys.clear(); _lastClickedKey = null; updateBatchBar();
}
async function batchDelete() {
  const keys = Array.from(selectedKeys);
  if (!keys.length) return;
  if (!confirm(`永久刪除 ${keys.length} 筆？此操作無法還原。`)) return;
  const key = getKey();
  if (!key) { alert('密鑰遺失'); return; }
  for (const k of keys) {
    try {
      const res = await fetch(`${WORKER_URL}/reports/delete?key=${encodeURIComponent(key)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kvKey: k })
      });
      if (res.ok) reports = reports.filter(x => x.kvKey !== k);
      else { const t = await res.text(); alert(`刪除失敗 (${res.status})：${t}`); break; }
    } catch(e) { alert(`網路錯誤：${e.message}`); break; }
  }
  selectedKeys.clear(); _lastClickedKey = null; render();
}
